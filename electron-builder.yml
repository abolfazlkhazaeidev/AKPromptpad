appId: com.akpromptpad.desktop
productName: AKPromptpad
copyright: Copyright © 2026 AKPromptpad
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName} Setup ${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AKPromptpad
  uninstallDisplayName: "${productName} ${version}"
